<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IT Training - Responda questionários das aulas, confira seu desempenho e evolua. Treinamento de TI. Totalmente estático, sem cadastro." />
    <meta name="theme-color" content="#6d5ef0" />
    <title>IT Training</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />

    <script>
      // Aplica o tema antes da renderização para evitar flash de cor incorreta.
      (function () {
        try {
          var theme = localStorage.getItem('studyhub:theme');
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (e) { /* ignora */ }
      })();
    </script>

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/quiz.css" />
    <link rel="stylesheet" href="./css/animations.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
